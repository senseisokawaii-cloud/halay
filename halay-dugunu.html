<!DOCTYPE html>
<html lang="tr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Halay Düğünü</title>
<style>
:root{--bg:#10200f;--ink:#fff}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:14px system-ui,sans-serif;overflow:hidden}
canvas{display:block;height:100vh;aspect-ratio:9/16;margin:0 auto;max-width:100%}
#p{position:fixed;left:8px;top:8px;background:rgba(0,0,0,.7);padding:8px;border-radius:8px;width:190px}
#p input,#p button{margin:2px 0;width:100%;box-sizing:border-box;padding:6px;font:inherit}
#p small{opacity:.8;display:block;margin-top:4px}
</style></head><body>
<canvas id="c" width="1080" height="1920"></canvas>
<div id="p">
<input id="u" value="Ayşe" aria-label="Kullanıcı adı">
<input id="n" type="number" value="45" aria-label="Coin">
<button onclick="onGift(u.value,+n.value)">Hediye at</button>
<input id="m" value="Hayırlı olsun!" aria-label="Mesaj">
<button onclick="onChat(u.value,m.value)">Mesaj yaz</button>
<button onclick="rnd()">10 rastgele kişi ekle</button>
<button onclick="for(const k in tot)delete tot[k];saveTot()">Birikimleri sıfırla</button>
<small>H tuşu paneli gizler. OBS için adresin sonuna #obs ekle. Mesaj yazan herkes halaya katılır (ücretsiz). Hediye sadece özel roller içindir. "değiştir" yazınca cinsiyet değişir.</small>
</div>
<script>
// Ayarlar: coin eşikleri ve süreler (saniye)
const CFG={join:23,leader:45,sag:113,ned:113,akraba:450,akr:240,dam:225,gel:225,stay:180,roleStay:300,max:32};
const cv=document.getElementById('c'),g=cv.getContext('2d'),pn=document.getElementById('p');
if(!location.hash.includes('test'))pn.style.display='none';

function saveTot(){try{localStorage.setItem(SK_KEY,JSON.stringify(tot))}catch(e){}}

const LC={gel:'#ffffff',dam:'#9fa8da',sag:'#ce93d8',ned:'#f8bbd0',l:'#ffca28',zurna:'#81c784',davul:'#ef9a9a'};
const CX=540,CY=1120,RX=440,RY=230;
const C={gel:[-48,20],dam:[48,20],ned:[-125,28],sag:[125,28],davul:[-130,-55],zurna:[130,-55]};
RK.akraba=9;LBL.akraba='Akraba';ROLE_COL.akraba='#00acc1';LC.akraba='#80deea';
const R=(a,b)=>a+Math.random()*(b-a),pick=a=>a[Math.floor(Math.random()*a.length)];
const SK=['#f2c9a0','#e8b48a','#d9a077','#f6d5b5'],HR=['#2b1a10','#4a2c17','#1b1b1b','#6b3b1a','#a5651f'],SU=['#2c3e50','#34495e','#5b3a29','#1f2f4a','#3d3d3d'],SH=['#ffffff','#9ec9e8','#f3d98b','#c9e8c0'],DR=['#c0392b','#8e44ad','#e67e22','#d81b60','#16a085','#2980b9'];
const stay=r=>r=='akraba'?CFG.akr:RK[r]>=3?CFG.roleStay:CFG.stay;

function roleFor(u){const t=tot[u]||0;
 for(const[k,v]of[['akraba',CFG.akraba],['gel',CFG.gel],['dam',CFG.dam],['sag',CFG.sag],['ned',CFG.ned],['l',CFG.leader]]){
  if(t<v)continue;
  if(RK[k]>=2&&Object.values(P).some(p=>p.role==k&&p.u!=u))continue;
  return k}return''}
function setRole(p,r){const was=ring.includes(p);p.role=r;
 if(r=='dam'||r=='sag'||r=='davul'||r=='zurna'||r=='akraba')p.male=true;if(r=='gel'||r=='ned')p.male=false;
 if(r=='akraba'){p.hr='#c9c9c9';p.sk='#d19a72';p.c1='#6d5a3a'}
 if(RK[r]>=3&&was)ring.splice(ring.indexOf(p),1)}
function enter(u,r){const p={u,male:Math.random()<.5,sk:pick(SK),hr:pick(HR),c1:pick(SU),c2:pick(SH),dr:pick(DR),x:Math.random()<.5?-70:1150,y:R(1250,1350),s:1,role:'',exp:Date.now()+stay(r)*1000,msg:'',mt:0,ph:R(0,6)};
 P[u]=p;setRole(p,r);if(RK[r]<3)ring.push(p)}
function onGift(u,c){u=(u||'').trim();if(!u||!c)return;tot[u]=(tot[u]||0)+c;saveTot();
 const p=P[u],r=roleFor(u);
 if(p){if(p.out)return;if(RK[r]>RK[p.role])setRole(p,r);p.exp=Date.now()+stay(p.role)*1000;return}
 if(!r)return;
 if(RK[r]<3&&ring.length>=CFG.max){if(!queue.includes(u))queue.push(u);return}
 const qi=queue.indexOf(u);if(qi>=0)queue.splice(qi,1);
 enter(u,r)}
function onChat(u,t){u=(u||'').trim();t=String(t==null?'':t).trim();if(!u||!t)return;
 let p=P[u];if(p&&p.out)return;
 if(!p){if(ring.length>=CFG.max){if(!queue.includes(u))queue.push(u);return}
  const qi=queue.indexOf(u);if(qi>=0)queue.splice(qi,1);enter(u,'n');p=P[u]}
 if(/^de[ğg]i[şs]tir$/i.test(t)){if(RK[p.role]<3)p.male=!p.male;return}
 p.msg=t.slice(0,30);p.mt=Date.now()+7000}
window.onGift=onGift;window.onChat=onChat;
// TikFinity bağlantısı (yalnızca adresin sonunda #obs veya #live varsa). TikFinity yerel WebSocket: ws://localhost:21213
const DEBUG=location.hash.includes('debug');
function tfHandle(m){let ev=m.event||m.type,d=m.data||m;if(!ev||!d)return;
 const u=d.uniqueId||d.nickname;if(!u)return;
 if(DEBUG)console.log('TikFinity',ev,d);
 if(ev=='chat'){onChat(u,d.comment||d.message||'')}
 else if(ev=='gift'){if(d.giftType===1&&d.repeatEnd===false)return;
  const coins=(d.diamondCount||0)*(d.repeatCount||1);if(coins>0)onGift(u,coins)}}
function tfConnect(){let ws;try{ws=new WebSocket('ws://localhost:21213/')}catch(e){setTimeout(tfConnect,5000);return}
 ws.onmessage=e=>{try{const m=JSON.parse(e.data);(Array.isArray(m)?m:[m]).forEach(tfHandle)}catch(x){}};
 ws.onclose=()=>setTimeout(tfConnect,3000);ws.onerror=()=>{try{ws.close()}catch(e){}}}
if(!location.hash.includes('test'))tfConnect();
const NAMES=['Ayşe','Mehmet','Zeynep','Ali','Elif','Hasan','Fatma','Emre','Selin','Burak','Derya','Cem','Gül','Kaan','Merve','Oğuz','Hülya','Tuna'];
function rnd(){for(let i=0;i<10;i++){const u=pick(NAMES)+Math.floor(R(1,99));setTimeout(()=>{onChat(u,pick(['Hayırlı olsun!','Halay başlasın','Selam Ankara','Mutluluklar','Oy oy']));if(Math.random()<.3)setTimeout(()=>onGift(u,pick([45,45,113,225,450])),300)},i*120)}}
